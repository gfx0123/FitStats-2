name: UI screenshots (simulator, fixture data)

# Manual (Actions → "UI screenshots" → Run workflow), or a push to the ui-check branch.
# The UI tests run on four macOS machines at once (about 20–25 minutes in all), each building the
# app first, so compiler errors end a run in about 10 minutes. With test names in
# ios/ui-tests-only.txt (one per line, # for comments) only those run, on one machine, for quicker
# rounds while fixing something; keep that file empty for the full run before a release.
# Screenshots and errors (errors-<group>.txt) end up together on the ci-screenshots branch.
on:
  workflow_dispatch:
  push:
    branches: [ui-check]

concurrency:
  group: ui-screens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - name: Which tests on which machine
        id: groups
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          only = []
          if os.path.exists("ios/ui-tests-only.txt"):
              for line in open("ios/ui-tests-only.txt"):
                  name = line.split("#")[0].strip()
                  if name:
                      only.append(name)
          if only:
              groups = [{"name": "only", "tests": " ".join(only)}]
          else:
              groups = [
                  {"name": "screens", "tests": "test01ConnectScreen test02AllScreens test11WeekAndSleep"},
                  {"name": "home", "tests": "test03HomeCards test13BodyAge"},
                  {"name": "insights-gestures", "tests": "test04InsightsPack test05Gestures test06DaysRemindersLargeText"},
                  {"name": "training-coach", "tests": "test07Training test08CoachesAndMuscles test09WakeTimes test10CoachTabs test12Widgets"},
              ]
          print("groups=" + json.dumps(groups))
          EOF
          cat "$GITHUB_OUTPUT"

  screens:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: screens (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate fixtures with the real sync engine
        run: node --experimental-strip-types --no-warnings supabase/tests/make-fixtures.ts "$RUNNER_TEMP/fixtures"

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          pick = next((d for d in phones if d["name"] == "iPhone 16 Pro"), phones[0] if phones else None)
          print(pick["udid"] if pick else "")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build the app and its UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project FitStats.xcodeproj \
            -scheme FitStats \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "error:|BUILD|TEST BUILD (SUCCEEDED|FAILED)" || true
          grep -qE "TEST BUILD SUCCEEDED|BUILD SUCCEEDED" test.log

      - name: Run screenshot UI tests (${{ matrix.group.tests }})
        working-directory: ios
        env:
          TEST_RUNNER_FITSTATS_FIXTURES: ${{ runner.temp }}/fixtures
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/shots
          TESTS: ${{ matrix.group.tests }}
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          ONLY=()
          for name in $TESTS; do ONLY+=("-only-testing:FitStatsUITests/ScreenshotTests/$name"); done
          set -o pipefail
          xcodebuild test-without-building \
            -project FitStats.xcodeproj \
            -scheme FitStats \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/Test.xcresult" \
            "${ONLY[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a test.log | grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|TEST EXECUTE (SUCCEEDED|FAILED)" || true
          grep -qE "TEST SUCCEEDED|TEST EXECUTE SUCCEEDED" test.log

      # Saved next to the screenshots, so the errors can be read from the ci-screenshots branch.
      - name: Compiler and test errors
        if: failure() || cancelled()
        working-directory: ios
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          { grep -E "error:|failed|XCTAssert|Test Case .* (failed|passed)" test.log | sort -u | head -300; } > "$RUNNER_TEMP/shots/errors-${{ matrix.group.name }}.txt" || true
          cat "$RUNNER_TEMP/shots/errors-${{ matrix.group.name }}.txt"

      - name: Collect screenshots
        if: always()
        run: |
          if ! ls "$RUNNER_TEMP/shots"/*.png >/dev/null 2>&1; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Test.xcresult" --output-path "$RUNNER_TEMP/shots" || true
          fi
          ls -la "$RUNNER_TEMP/shots" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.group.name }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: screens
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: shots
      - name: Push screenshots to the ci-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots 2>/dev/null || exit 0
          [ -n "$(ls -A .)" ] || exit 0
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

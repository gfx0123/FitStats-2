name: Server deploy (Supabase Edge Function)

# Deploys supabase/functions/fitstats from the repository with the Supabase CLI, after the server
# tests pass, then checks that the live function reports the version in lib/version.ts.
# It needs a Supabase access token (supabase.com → Account → Access Tokens) saved as the
# repository's Actions secret SUPABASE_ACCESS_TOKEN; without it the run only tests.
# Database migrations are not applied here.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/tests/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: zkxnbcrayjwkeyxlungk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Server tests
        run: node --experimental-strip-types --no-warnings --test supabase/tests/logic.test.ts supabase/tests/sync.test.ts supabase/tests/coach.test.ts supabase/tests/csvimport.test.ts supabase/tests/bodyage.test.ts

      - name: Look for the access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::The SUPABASE_ACCESS_TOKEN secret is not set, so nothing was deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest

      - name: Deploy fitstats
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The app sends its own key (x-app-key), not a Supabase JWT.
        run: supabase functions deploy fitstats --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Health check
        if: steps.token.outputs.present == 'true'
        run: |
          want=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' supabase/functions/fitstats/lib/version.ts)
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS "https://$PROJECT_REF.supabase.co/functions/v1/fitstats?r=health" || true)
            echo "$body"
            case "$body" in *"\"version\":\"$want\""*) exit 0 ;; esac
            sleep 10
          done
          echo "::error::The live function doesn't report version $want."
          exit 1

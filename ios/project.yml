# XcodeGen spec. CI runs `xcodegen generate` and builds an unsigned IPA;
# Sideloadly signs it with your Apple ID when installing.
name: FitStats
options:
  bundleIdPrefix: com.fitstats
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.14.0"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  FitStats:
    type: application
    platform: iOS
    sources:
      - path: FitStats
      - path: Shared
    dependencies:
      - target: FitStatsWidget
    info:
      path: FitStats/Info.plist
      properties:
        CFBundleDisplayName: FitStats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: FitStats connects to your Fitbit Air over Bluetooth to show your live heart rate when Share heart rate is on.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.fitstats.connect
            CFBundleURLSchemes:
              - fitstats
        FitStatsServerURL: https://zkxnbcrayjwkeyxlungk.supabase.co/functions/v1/fitstats
        # Fredoka (SIL Open Font License, Resources/Fonts/OFL.txt): the app's rounded font.
        UIAppFonts:
          - Fredoka-Light.ttf
          - Fredoka-Regular.ttf
          - Fredoka-Medium.ttf
          - Fredoka-SemiBold.ttf
          - Fredoka-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitstats.air.k29x
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
  # Home Screen and Lock Screen widgets. It shares today's numbers with the app through an app
  # group (Entitlements/); the IPA step signs both with those entitlements so signing apps see it.
  FitStatsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FitStatsWidget
      - path: Shared
      - path: FitStats/UI/Theme.swift
    info:
      path: FitStatsWidget/Info.plist
      properties:
        CFBundleDisplayName: FitStats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FitStatsServerURL: https://zkxnbcrayjwkeyxlungk.supabase.co/functions/v1/fitstats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitstats.air.k29x.widget
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
        SKIP_INSTALL: YES
  FitStatsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitStatsUITests
    dependencies:
      - target: FitStats
    settings:
      base:
        TEST_TARGET_NAME: FitStats
        PRODUCT_BUNDLE_IDENTIFIER: com.fitstats.air.k29x.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FitStats:
    build:
      targets:
        FitStats: all
        FitStatsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitStatsUITests
    archive:
      config: Release
